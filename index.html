<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>Mis Gastos</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Encabezado -->
  <header class="top">
    <div>
      <p class="saludo" id="saludo">Hola</p>
      <h1>Mis Gastos</h1>
    </div>
    <div class="top-acciones">
      <span id="conexion" class="conexion" title="Estado de conexión">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M2 8.8a15 15 0 0 1 20 0" />
          <path d="M5 12.5a10 10 0 0 1 14 0" />
          <path d="M8.5 16a5 5 0 0 1 7 0" />
          <circle cx="12" cy="19.5" r="1" fill="currentColor" />
          <line class="tachado" x1="3" y1="3" x2="21" y2="21" />
        </svg>
        <span>En línea</span>
      </span>
      <button id="btn-instalar" class="btn-instalar" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14" /></svg>
        Instalar
      </button>
    </div>
  </header>

  <main>
    <!-- Resumen -->
    <section class="resumen">
      <p class="resumen-label">Total gastado</p>
      <p class="resumen-total" id="total">$0.00</p>
      <div class="resumen-datos">
        <div><b id="hoy">$0.00</b><small>Hoy</small></div>
        <div><b id="cantidad">0</b><small>Gastos</small></div>
        <div><b id="promedio">$0.00</b><small>Promedio</small></div>
      </div>
      <div class="barra" id="barra"></div>
      <div class="leyenda" id="leyenda"></div>
    </section>

    <!-- Filtros por categoría -->
    <div class="filtros" id="filtros"></div>

    <!-- Lista de gastos -->
    <section id="lista"></section>
  </main>

  <!-- Botón flotante -->
  <button class="fab" id="btn-abrir" aria-label="Agregar gasto">+</button>

  <!-- Panel para agregar gasto -->
  <div class="fondo" id="fondo"></div>
  <form class="hoja" id="formulario" autocomplete="off">
    <div class="hoja-asa"></div>
    <div class="hoja-titulo">
      <h2>Nuevo gasto</h2>
      <button type="button" class="btn-cerrar" id="btn-cerrar" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12" /></svg>
      </button>
    </div>

    <label class="campo-monto">
      <span>$</span>
      <input id="monto" type="number" step="0.01" min="0.01" placeholder="0.00" inputmode="decimal" required>
    </label>
    <div class="rapidos">
      <button type="button" data-monto="50">+50</button>
      <button type="button" data-monto="100">+100</button>
      <button type="button" data-monto="200">+200</button>
      <button type="button" data-monto="500">+500</button>
    </div>

    <p class="etiqueta">¿En qué gastaste?</p>
    <div class="categorias" id="categorias"></div>

    <p class="etiqueta">Detalle <small>(opcional)</small></p>
    <input id="descripcion" class="campo" maxlength="40">

    <button type="submit" class="btn-guardar">Guardar gasto</button>
  </form>

  <!-- Notificación -->
  <div class="toast" id="toast"></div>

  <script src="js/categorias.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/aviso.js"></script>
  <script src="js/pantalla.js"></script>
  <script src="js/formulario.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
